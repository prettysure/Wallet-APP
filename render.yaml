services:
  - type: web
    name: wallet-app-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://wallet-app-s9io.vercel.app,http://localhost:5173
      - key: DATA_DIR
        value: /var/data
    disk:
      name: wallet-data
      mountPath: /var/data
      sizeGB: 1
